name: Update contribution fingerprint

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate fingerprint SVG
        env:
          GH_LOGIN: AugrammingWithG
          GH_TOKEN: ${{ secrets.FINGERPRINT_TOKEN || secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: assets/github-fingerprint.svg
        run: python scripts/generate_fingerprint.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-fingerprint.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh contribution fingerprint [skip ci]"
            git push
          fi
