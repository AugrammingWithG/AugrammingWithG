<svg width="720" height="760" viewBox="0 0 720 760" xmlns="http://www.w3.org/2000/svg">
  <title>GitHub contribution fingerprint</title>
  <defs>
    <filter id="dotGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="720" height="760" fill="#000000"/>

  <text x="40" y="62" font-family="'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="32" font-weight="800" letter-spacing="0.5" fill="#FFFFFF">CONTRIBUTION FINGERPRINT</text>
  <line x1="40" y1="92" x2="680" y2="92" stroke="#2A2A2E" stroke-width="1"/>

  <g transform="translate(40,132)">
    <circle cx="8" cy="0" r="8" fill="#CFD0D4"/>
    <text x="26" y="5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#E6E6E9">You</text>
  </g>
  <text x="40" y="166" font-family="ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',monospace" font-size="11.5" fill="#6E6E76">AugrammingWithG · Sep 22, 2023 – Present</text>

  <g transform="translate(360,468)">
    <circle cx="0" cy="0" r="47.5" fill="none" stroke="#2E2E32" stroke-width="1" stroke-dasharray="3 4"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#2E2E32" stroke-width="1" stroke-dasharray="3 4"/>
    <circle cx="0" cy="0" r="142.5" fill="none" stroke="#2E2E32" stroke-width="1" stroke-dasharray="3 4"/>
    <circle cx="0" cy="0" r="190" fill="none" stroke="#3A3A3E" stroke-width="1" stroke-dasharray="3 4"/>

    <line x1="0" y1="0" x2="0" y2="-190" stroke="#2E2E32" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="0" y1="0" x2="164.5" y2="95" stroke="#2E2E32" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="0" y1="0" x2="-164.5" y2="95" stroke="#2E2E32" stroke-width="1" stroke-dasharray="3 4"/>

    <path d="M-5,0 L5,0 M0,-5 L0,5" stroke="#55555A" stroke-width="1"/>

    <polygon points="0.0,-154.3 129.3,74.6 -47.0,27.1" fill="#CFD0D4" fill-opacity="0.28" stroke="#CFD0D4" stroke-width="2" stroke-linejoin="round"/>

    <g fill="#FFFFFF" filter="url(#dotGlow)">
      <circle cx="0.0" cy="-154.3" r="5"/>
      <circle cx="129.3" cy="74.6" r="5"/>
      <circle cx="-47.0" cy="27.1" r="5"/>
    </g>

    <g text-anchor="middle">
      <text x="0" y="-214" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#9B9BA2">Total Contributions</text>
      <text x="0" y="-186" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">406</text>
      <text x="0" y="-166" font-family="ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',monospace" font-size="11" fill="#6E6E76">since Sep 22, 2023</text>
    </g>

    <g text-anchor="start">
      <text x="182" y="118" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#9B9BA2">Longest Streak</text>
      <text x="182" y="146" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">11</text>
      <text x="182" y="168" font-family="ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',monospace" font-size="11" fill="#6E6E76">Jul 21 – 31</text>
    </g>

    <g text-anchor="end">
      <text x="-182" y="118" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#9B9BA2">Current Streak</text>
      <text x="-182" y="146" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">4</text>
      <text x="-182" y="168" font-family="ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',monospace" font-size="11" fill="#6E6E76">Aug 30 – Sep 2</text>
    </g>
  </g>

  <text x="40" y="732" font-family="ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',monospace" font-size="10.5" fill="#4E4E54">axes scaled to 500 contributions / 14-day streaks · updated 2026-09-02</text>
</svg>
